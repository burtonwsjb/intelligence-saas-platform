# Disposable local Postgres and Redis for Phase 02–05 development.
# Cloud database provider remains Neon. Do not provision cloud Redis from this file.
# Do not use this compose file in production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_dev_only
      POSTGRES_DB: isp
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp -d isp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
