name: Apply verified monitoring repair
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/apply-monitoring-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/scope-truth-release-repair' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact locally checked patch on isolated branch
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,re,subprocess
          raw=''.join(pathlib.Path('.repair/monitoring.part'+str(i)).read_text() for i in range(3))
          patch=lzma.decompress(base64.b64decode(raw,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='5fa16a64a17b116dda8dde212fb719318d2fdebee54934755b8457827c1dcecc'
          for part in patch.decode().split('diff --git ')[1:]:
              m=re.fullmatch(r'a/(\S+) b/(\S+)',part.splitlines()[0])
              assert m and m[1]==m[2] and '..' not in m[1].split('/')
              assert m[1]=='.env.example' or m[1].startswith(('apps/','packages/','docs/','scripts/','.github/workflows/'))
              old=re.search(r'^index ([a-f0-9]{40})\.\.',part,re.M)[1]
              if old!='0'*40:
                  assert subprocess.check_output(['git','rev-parse','HEAD:'+m[1]],text=True).strip()==old, 'Refusing concurrent source overwrite'
              else:
                  assert not pathlib.Path(m[1]).exists()
          pathlib.Path('/tmp/monitoring.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/monitoring.patch
          git apply --index /tmp/monitoring.patch
          git rm .repair/monitoring.part0 .repair/monitoring.part1 .repair/monitoring.part2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: complete automatic creator monitoring and safe staging preflight'
          git push origin HEAD:refs/heads/fix/scope-truth-release-repair
          echo "Applied code commit: $(git rev-parse HEAD)"
