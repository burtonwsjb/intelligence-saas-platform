name: Recover and verify scheduled free mode

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/recover-scheduled-free-mode.yml

permissions:
  contents: read

concurrency:
  group: recover-scheduled-free-mode-pr-8
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.pull_request.number == 8 &&
      github.event.pull_request.head.ref == 'fix/redis-free-tier-budget-guard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'burtonwsjb/intelligence-saas-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.recover.outputs.revision }}
    steps:
      - name: Attach the saved implementation without overwriting concurrent work
        id: recover
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'fix/redis-free-tier-budget-guard';
            const expectedParent = 'c24d3561c2ba419d122775b5243037d2060598b1';
            const savedTree = 'eebcde81821eae5d1431982078c91f76717600f9';
            const eventHead = context.payload.pull_request.head.sha;
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            if (ref.data.object.sha !== eventHead) {
              throw new Error('Draft branch has newer work. Recovery stopped without changing it.');
            }
            const head = await github.rest.git.getCommit({ owner, repo, commit_sha: eventHead });
            if (head.data.parents.length !== 1 || head.data.parents[0].sha !== expectedParent) {
              throw new Error('Unexpected branch ancestry. Recovery stopped; preserve concurrent changes.');
            }
            const tree = await github.rest.git.getTree({ owner, repo, tree_sha: savedTree, recursive: 'true' });
            if (tree.data.truncated) throw new Error('Saved tree inspection was truncated.');
            const files = tree.data.tree.filter(entry => entry.type === 'blob').map(entry => entry.path);
            for (const required of ['PROJECT_SOURCE_OF_TRUTH.md', 'AGENTS.md', 'package.json', 'apps/worker/src/worker.ts']) {
              if (!files.includes(required)) throw new Error(`Saved implementation lacks ${required}.`);
            }
            if (files.some(path => path.startsWith('.budget-transfer/'))) {
              throw new Error('Temporary transfer content remains in the saved tree. Manual review required.');
            }
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'feat: recover scheduled Postgres free-only worker and owner resource controls for verification',
              tree: savedTree,
              parents: [eventHead],
            });
            // Non-force update fails if another writer advances the draft branch.
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false });
            core.setOutput('revision', commit.data.sha);
            await core.summary.addHeading('Saved implementation recovered to draft branch')
              .addRaw(`Revision: ${commit.data.sha}\nSaved tree: ${savedTree}\n`)
              .addRaw('No main-branch merge, deployment, hosted database access, provider activation or paid setting change. Validation follows in this workflow.\n')
              .write();

  validate:
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: isp_admin
          POSTGRES_PASSWORD: isp_ci_only
          POSTGRES_DB: isp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isp_admin -d isp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://isp_admin:isp_ci_only@localhost:5432/isp_ci
      REDIS_URL: redis://localhost:6379
      QUEUE_PREFIX: ci
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.recover.outputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refuse any nonlocal integration-test target
        run: |
          node -e 'for (const name of ["DATABASE_ADMIN_URL","REDIS_URL"]) { const host = new URL(process.env[name]).hostname; if (!["localhost","127.0.0.1","::1","[::1]"].includes(host)) { throw new Error("Nonlocal test target refused: " + name); } }'
          git rev-parse HEAD
          mkdir -p /tmp/free-mode-verification
          git rev-parse HEAD > /tmp/free-mode-verification/revision.txt
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Repository tests with bounded concurrency
        run: pnpm exec turbo run test --concurrency=1 -- --maxWorkers=1
      - name: PostgreSQL isolation tests
        run: pnpm test:isolation
      - name: Queue API and worker integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Load smoke
        run: pnpm test:load-smoke
      - name: Static security scan
        run: pnpm test:security-scan
      - name: Diff check
        run: git diff --check
      - name: Save verification state
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p /tmp/free-mode-verification
          printf '%s\n' "$RESULT" > /tmp/free-mode-verification/job-status.txt
          git status --short > /tmp/free-mode-verification/worktree.txt
          printf '%s\n' 'Local Postgres and Redis only. No hosted Upstash request, worker restart, paid activation, main merge, or production release was performed.' > /tmp/free-mode-verification/boundaries.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-mode-recovery-verification
          path: /tmp/free-mode-verification
          retention-days: 7
