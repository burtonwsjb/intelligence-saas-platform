name: Apply and verify isolated repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: isolated-scope-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.head_ref == 'fix/scope-truth-release-repair' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: isp_admin
          POSTGRES_PASSWORD: isp_ci_only
          POSTGRES_DB: isp_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U isp_admin -d isp_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://isp_admin:isp_ci_only@localhost:5432/isp_ci
      REDIS_URL: redis://localhost:6379
      QUEUE_PREFIX: ci_repair
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply hash-verified source patch to isolated branch
        id: apply
        shell: bash
        run: |
          if [ ! -f .repair/scope-code.part0 ]; then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,re,subprocess
          raw=''.join(pathlib.Path('.repair/scope-code.part'+str(i)).read_text() for i in range(2))
          patch=lzma.decompress(base64.b64decode(raw,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='60376cf5cc24e2d35c702a1a3365d820726665c89075548231c346d6944e22d3'
          for part in patch.decode().split('diff --git ')[1:]:
              header=part.splitlines()[0]
              m=re.fullmatch(r'a/(\S+) b/(\S+)',header)
              assert m and m[1]==m[2] and m[1].startswith(('apps/','packages/','docs/')) and '..' not in m[1].split('/')
              old=re.search(r'^index ([a-f0-9]{40})\.\.',part,re.M)[1]
              if old!='0'*40:
                  actual=subprocess.check_output(['git','rev-parse','HEAD:'+m[1]],text=True).strip()
                  assert actual==old, 'Source changed; refusing to overwrite '+m[1]
              else:
                  assert not pathlib.Path(m[1]).exists()
          pathlib.Path('/tmp/scope-repair.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --index --check /tmp/scope-repair.patch
          git apply --unidiff-zero --index /tmp/scope-repair.patch
          git rm .repair/scope-code.part0 .repair/scope-code.part1
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair worker discovery execution, quota persistence, downstream jobs and shutdown'
          git push origin HEAD:refs/heads/fix/scope-truth-release-repair
          echo "Repair code commit: $(git rev-parse HEAD)"
          echo 'applied=true' >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:isolation
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm test:load-smoke && pnpm test:security-scan && git diff --check
