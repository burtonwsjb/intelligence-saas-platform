name: Budget local test tools
on:
  pull_request:
    paths: [.github/workflows/budget-local-test-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    if: github.head_ref == 'fix/redis-free-tier-budget-guard'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Collect disposable local Redis 7 test runtime
        run: |
          docker pull redis:7-bookworm
          cid=$(docker create redis:7-bookworm)
          mkdir -p /tmp/budget-redis
          docker cp "$cid":/usr/local/bin/redis-server /tmp/budget-redis/redis-server
          docker rm "$cid"
          tar -czf /tmp/budget-redis.tar.gz -C /tmp/budget-redis .
      - uses: actions/upload-artifact@v4
        with:
          name: budget-local-redis7
          path: /tmp/budget-redis.tar.gz
          retention-days: 1
