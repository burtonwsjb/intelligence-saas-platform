name: Repair workspace
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  workspace:
    if: github.head_ref == 'fix/scope-truth-release-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package isolated source and dependency workspace
        shell: bash
        run: |
          mkdir -p /tmp/isp-repair
          git archive HEAD | tar -x -C /tmp/isp-repair
          find . -type d -name node_modules -prune -print0 | tar --null -T - -cf /tmp/isp-dependencies.tar
          tar -xf /tmp/isp-dependencies.tar -C /tmp/isp-repair
          cp -a ~/setup-pnpm/node_modules/pnpm /tmp/isp-repair/.repair-pnpm
          tar -czf /tmp/isp-repair-workspace.tar.gz -C /tmp/isp-repair .
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-repair-workspace
          path: /tmp/isp-repair-workspace.tar.gz
          retention-days: 1
          compression-level: 0
