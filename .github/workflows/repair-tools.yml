name: Repair tools
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tools:
    if: github.head_ref == 'fix/scope-truth-release-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - run: tar -czhf /tmp/repair-pnpm.tar.gz -C ~/setup-pnpm/node_modules pnpm
      - uses: actions/upload-artifact@v4
        with:
          name: offline-pnpm
          path: /tmp/repair-pnpm.tar.gz
          retention-days: 1
          compression-level: 0
